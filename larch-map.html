<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>라치밸리 트레킹 지도</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
    }
    #map {
      width: 100vw;
      height: 100vh;
    }
    .mapboxgl-ctrl-attrib-inner {
      font-size: 11px !important;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    mapboxgl.accessToken = 'pk.eyJ1Ijoic2FuYmFyYWdpIiwiYSI6ImNtOWNlMHJ5dDAydXAya3I3NmtoNzFocWQifQ.xOONAcpwqZe48Xx5JRQd1Q';
    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/outdoors-v12',
      center: [-116.2, 51.33],
      zoom: 13
    });

    map.on('load', () => {
      map.addSource('larch-trail', {
        type: 'geojson',
        data: 'https://dl.dropboxusercontent.com/scl/fi/52ny1so7ft1ud7nhk4pry/route.json?rlkey=w34yvo9jtxhw0jln3kilqn12c&st=j2367jlt'
      });

      map.addLayer({
        id: 'larch-trail-line',
        type: 'line',
        source: 'larch-trail',
        layout: {
          'line-join': 'round',
          'line-cap': 'round'
        },
        paint: {
          'line-color': '#FFD700',
          'line-width': 4
        }
      });
    });
  </script>
</body>
</html>
