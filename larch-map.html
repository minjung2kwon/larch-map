<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Animated Route</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    #map {
      height: 100vh;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([51.32814, -116.18155], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/">OpenStreetMap</a> contributors'
    }).addTo(map);

    fetch("https://dl.dropboxusercontent.com/scl/fi/52ny1so7ft1ud7nhk4pry/route.json?rlkey=w34yvo9jtxhw0jln3kilqn12c&st=j2367jlt")
      .then(res => res.json())
      .then(data => {
        const coords = data.geometry.coordinates.map(c => [c[1], c[0]]); // 위도, 경도 순서

        // 경로 선
        const polyline = L.polyline(coords, { color: 'gold', weight: 4 }).addTo(map);
        map.fitBounds(polyline.getBounds());

        // 마커 생성
        const marker = L.circleMarker(coords[0], {
          radius: 7,
          color: 'red',
          fillColor: 'red',
          fillOpacity: 1
        }).addTo(map);

        // 애니메이션
        let index = 0;
        function animate() {
          index = (index + 1) % coords.length;
          marker.setLatLng(coords[index]);
        }

        setInterval(animate, 80); // 이동 속도
      })
      .catch(err => {
        console.error("GeoJSON 로딩 실패:", err);
        alert("경로 데이터를 불러올 수 없습니다.");
      });
  </script>
</body>
</html>
