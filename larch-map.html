    let index = 0;
    let forward = true;

    map.on("load", () => {
      // 트레일 선 추가
      map.addSource("larch-trail", {
        type: "geojson",
        data: geojson
      });

      map.addLayer({
        id: "larch-trail-line",
        type: "line",
        source: "larch-trail",
        layout: {
          "line-join": "round",
          "line-cap": "round"
        },
        paint: {
          "line-color": "#FFD700",
          "line-width": 4
        }
      });

      // 마커 초기화
      marker = new mapboxgl.Marker({ color: "#FF4500" })
        .setLngLat(coords[0])
        .addTo(map);

      animateMarker();
    });

    function animateMarker() {
      if (!coords.length) return;

      marker.setLngLat(coords[index]);

      if (forward) {
        index++;
        if (index >= coords.length - 1) forward = false;
      } else {
        index--;
        if (index <= 0) forward = true;
      }

      setTimeout(animateMarker, 100); // ← 느리게 0.1초 간격
    }
