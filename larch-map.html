<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Mapbox 테스트</title>
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
  <style>
    #map { width: 100%; height: 400px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    mapboxgl.accessToken = '토큰';
    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/outdoors-v12',
      center: [-116.2, 51.33],
      zoom: 13
    });

    map.on('load', () => {
      fetch('https://dl.dropboxusercontent.com/scl/fi/52ny1so7ft1ud7nhk4pry/route.json?...')
        .then(res => res.json())
        .then(data => {
          map.addSource('trail', { type: 'geojson', data });
          map.addLayer({
            id: 'trail-line',
            type: 'line',
            source: 'trail',
            paint: { 'line-color': '#FFD700', 'line-width': 4 }
          });
        });
    });
  </script>
</body>
</html>
