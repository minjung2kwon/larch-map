<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Leaflet 트레킹 지도</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />
  <style>
    #map {
      height: 500px;
      width: 100%;
    }
  </style>
</head>
<body>
  <h3>⛰ 라치밸리 트레일</h3>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([51.33, -116.2], 13);

    // 기본 타일 + 저작권 표기
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/">OpenStreetMap</a> contributors'
    }).addTo(map);

    // GeoJSON 경로 불러오기
    fetch("https://dl.dropboxusercontent.com/scl/fi/52ny1so7ft1ud7nhk4pry/route.json?rlkey=w34yvo9jtxhw0jln3kilqn12c&st=j2367jlt")
      .then(res => res.json())
      .then(data => {
        const coords = data.features[0].geometry.coordinates.map(c => [c[1], c[0]]); // 위도, 경도 변환

        const polyline = L.polyline(coords, {
          color: 'gold',
          weight: 4
        }).addTo(map);

        // 지도 위치를 경로에 맞게 조정
        map.fitBounds(polyline.getBounds());

        // 동그라미 마커
        const circle = L.circleMarker(coords[0], {
          radius: 8,
          color: 'red',
          fillColor: 'red',
          fillOpacity: 1
        }).addTo(map);

        // 애니메이션
        let index = 0;
        function animate() {
          index = (index + 1) % coords.length;
          circle.setLatLng(coords[index]);
        }

        setInterval(animate, 100);
      });
  </script>
</body>
</html>
