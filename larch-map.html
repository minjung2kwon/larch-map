<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>라치밸리 트레킹 지도</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    #map {
      height: 500px;
      width: 100%;
    }
  </style>
</head>
<body>

<h2>⛰ 라치밸리 트레일 지도</h2>
<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const map = L.map('map').setView([51.33, -116.2], 13);

  // OpenStreetMap 타일 추가
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/">OpenStreetMap</a> contributors',
  }).addTo(map);

  // 경로 GeoJSON 데이터 불러오기
  fetch('https://dl.dropboxusercontent.com/scl/fi/52ny1so7ft1ud7nhk4pry/route.json?rlkey=w34yvo9jtxhw0jln3kilqn12c&st=j2367jlt')
    .then(res => res.json())
    .then(data => {
      L.geoJSON(data, {
        style: {
          color: '#FFD700',
          weight: 4
        }
      }).addTo(map);
    })
    .catch(err => {
      console.error('경로 데이터를 불러올 수 없습니다:', err);
    });
</script>

</body>
</html>
