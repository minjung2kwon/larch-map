<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>라치밸리 트레킹 지도</title>
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">
  <style>
    body { margin: 0; padding: 0; font-family: sans-serif; }
    #map { width: 100%; height: 100vh; }
    .copyright {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(255,255,255,0.8);
      padding: 4px 8px;
      font-size: 12px;
      border-radius: 4px;
      font-family: sans-serif;
      z-index: 9999;
    }
  </style>
</head>
<body>

<div id="map"></div>
<div class="copyright">© Mapbox © OpenStreetMap</div>

<script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
<script>
  mapboxgl.accessToken = 'pk.eyJ1Ijoic2FuYmFyYWdpIiwiYSI6ImNtOWNlMHJ5dDAydXAya3I3NmtoNzFocWQifQ.xOONAcpwqZe48Xx5JRQd1Q';

  const map = new mapboxgl.Map({
    container: 'map',
    style: 'mapbox://styles/mapbox/outdoors-v12',
    center: [-116.2, 51.33],
    zoom: 13,
    attributionControl: false
  });

  map.on('load', () => {
    map.addSource('larch-trail', {
      type: 'geojson',
      data: {
        type: 'FeatureCollection',
        features: [{
          type: 'Feature',
          geometry: {
            type: 'LineString',
            coordinates: []
          }
        }]
      }
    });

    map.addLayer({
      id: 'larch-trail-line',
      type: 'line',
      source: 'larch-trail',
      layout: {
        'line-join': 'round',
        'line-cap': 'round'
      },
      paint: {
        'line-color': '#FFD700',
        'line-width': 4
      }
    });

    animateTrail();
  });

  function animateTrail() {
    const source = map.getSource('larch-trail');
    const geojsonUrl = 'https://dl.dropboxusercontent.com/scl/fi/52ny1so7ft1ud7nhk4pry/route.json?rlkey=w34yvo9jtxhw0jln3kilqn12c&st=j2367jlt';

    fetch(geojsonUrl)
      .then(res => res.json())
      .then(data => {
        const coords = data.features[0].geometry.coordinates;
        let i = 0;
        const animatedLine = {
          type: 'FeatureCollection',
          features: [{
            type: 'Feature',
            geometry: {
              type: 'LineString',
              coordinates: []
            }
          }]
        };

        function draw() {
          if (i < coords.length) {
            animatedLine.features[0].geometry.coordinates.push(coords[i]);
            source.setData(animatedLine);
            i++;
            requestAnimationFrame(draw);
          }
        }

        draw();
      });
  }
</script>

</body>
</html>
